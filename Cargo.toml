[workspace]
resolver = "3"
members = ["crates/*"]
# Each crate states its version, edition and dependencies itself: products use the crates from a
# vendored copy as path dependencies, where inheriting from this workspace is fragile.

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# RSA key generation is slow without optimisation; tests start many services, each of which
# creates its first key.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
