{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pacod-id.secretName" . }}
  labels:
    {{- include "pacod-id.labels" . | nindent 4 }}
type: Opaque
stringData:
  PID_DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  PID_KEK: {{ required "secrets.kek is required: openssl rand -base64 32" .Values.secrets.kek | quote }}
  PID_TOKEN_PEPPER: {{ required "secrets.tokenPepper is required: openssl rand -base64 32" .Values.secrets.tokenPepper | quote }}
  {{- with .Values.secrets.kekOld }}
  PID_KEK_OLD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.legacyPeppers }}
  PID_LEGACY_PEPPERS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  PID_SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapAdminPassword }}
  PID_BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
