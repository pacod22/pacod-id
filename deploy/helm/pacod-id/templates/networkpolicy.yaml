{{- if .Values.networkPolicy.enabled }}
# The public port from the Ingress controller (and whatever publicFrom names), the internal
# port from the products only, the metrics port from the scrapers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-id.fullname" . }}
  labels:
    {{- include "pacod-id.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pacod-id.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {{- with .Values.networkPolicy.publicFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.internalFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http-internal
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
{{- end }}
