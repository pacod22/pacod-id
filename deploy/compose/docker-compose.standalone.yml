# pacod-id's development stack, standalone: its own copies of the shared components pacod-id
# needs, under their shared names (pacod-demo/docs/NETWORK.md), plus the mock Google of the dev
# realm. Loaded together with docker-compose.yml by "make compose-up". The full stack does not
# load this file; it runs one pacod-postgres, pacod-db-init and pacod-mailpit for every product
# and reuses these definitions through "extends". Every service rotates its log as
# pacod-demo/docs/LOGGING.md says (x-logging).

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  pacod-postgres:
    logging: *logging
    image: postgres:18.6-alpine3.24
    container_name: pacod-postgres
    environment:
      POSTGRES_PASSWORD: ${PID_DEV_PG_SUPERUSER_PASSWORD:?run deploy/compose/init-env.sh first}
    volumes:
      - pacod-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - pacod-net
    restart: unless-stopped

  # Creates each product's role and database on pacod-postgres, at every start (idempotent):
  # every platform/postgres/*-db.sh it finds in /initdb.d, in name order. Here: pacod-id's.
  pacod-db-init:
    logging: *logging
    image: postgres:18.6-alpine3.24
    container_name: pacod-db-init
    depends_on:
      pacod-postgres:
        condition: service_healthy
    environment:
      PGHOST: pacod-postgres
      PGUSER: postgres
      PGPASSWORD: ${PID_DEV_PG_SUPERUSER_PASSWORD:?run deploy/compose/init-env.sh first}
      PID_DB_PASSWORD: ${PID_DB_PASSWORD:?run deploy/compose/init-env.sh first}
    volumes:
      - ../../platform/postgres:/initdb.d:ro
    entrypoint: ['sh', '-c', 'set -e; for f in /initdb.d/*.sh; do sh "$$f"; done']
    networks:
      - pacod-net
    restart: 'no'

  pacod-mailpit:
    logging: *logging
    image: axllent/mailpit:v1.27
    container_name: pacod-mailpit
    ports:
      - '127.0.0.1:26026:8025'
    networks:
      - pacod-net
    restart: unless-stopped

  # Stands in for Google: the dev realm's google block names it (pacod-id.toml).
  id-mock-idp:
    logging: *logging
    build:
      context: ../..
      dockerfile: deploy/docker/pacod-id.Dockerfile
      target: mock-idp
    image: pacod-id-mock-idp:dev
    container_name: id-mock-idp
    environment:
      PID_MOCK_ISSUER: http://127.0.0.1:26080
      PID_MOCK_CLIENTS: dev-google:${PID_DEV_GOOGLE_SECRET:?run deploy/compose/init-env.sh first}
    ports:
      - '127.0.0.1:26080:7080'
    networks:
      - pacod-net
    restart: unless-stopped

volumes:
  pacod-postgres-data:

networks:
  pacod-net:
    external: true
