# pacod-id's development stack: PostgreSQL, pacod-id, a mail sink and the mock Google.
#
#   make compose-up      secrets in deploy/compose/.env (made once, random), build, start
#   make compose-down    stop; the database volume stays (docker compose ... down -v drops it)
#
# Everything listens on 127.0.0.1 only:
#   26070  pacod-id, public: the issuer http://127.0.0.1:26070 (sign-in pages, /oidc, /ui-api)
#   26071  pacod-id, internal: /internal/v1, /admin/v1, server-to-server token calls
#   26072  pacod-id, metrics and probes
#   26026  mailpit's web page: every mail the stack sends ends here, none leaves the machine
#   26080  the mock Google (its issuer, which the browser visits)
#
# pacod-id connects as the role pacod_id, which owns the database pacod_id and is not a
# superuser (initdb/10-pacod-id.sh), as in production.

# Containers are named pid-dev-*.
name: pid-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${PID_DEV_PG_SUPERUSER_PASSWORD:?run deploy/compose/init-env.sh first}
      PID_DB_PASSWORD: ${PID_DB_PASSWORD:?run deploy/compose/init-env.sh first}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'pacod_id']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  pacod-id:
    build:
      context: ../..
      dockerfile: deploy/docker/pacod-id.Dockerfile
      target: pacod-id
    image: pacod-id:dev
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PID_DATABASE_URL: postgres://pacod_id:${PID_DB_PASSWORD}@postgres:5432/pacod_id
      PID_KEK: ${PID_KEK:?run deploy/compose/init-env.sh first}
      PID_TOKEN_PEPPER: ${PID_TOKEN_PEPPER:?run deploy/compose/init-env.sh first}
      PID_DEV_APP_SECRET: ${PID_DEV_APP_SECRET:?run deploy/compose/init-env.sh first}
      PID_DEV_SERVICE_SECRET: ${PID_DEV_SERVICE_SECRET:?run deploy/compose/init-env.sh first}
      PID_DEV_GOOGLE_SECRET: ${PID_DEV_GOOGLE_SECRET:?run deploy/compose/init-env.sh first}
      PID_BOOTSTRAP_ADMIN_EMAIL: admin@pacod-id.dev.test
      PID_BOOTSTRAP_ADMIN_PASSWORD: ${PID_BOOTSTRAP_ADMIN_PASSWORD:?run deploy/compose/init-env.sh first}
      PID_BOOTSTRAP_ADMIN_REALM: shop
      PID_BOOTSTRAP_ADMIN_ROLES: id.admin
      # The mail sink; mail never leaves the stack.
      PID_SMTP_HOST: mailpit
      PID_SMTP_PORT: '1025'
      PID_SMTP_TLS: none
      PID_EMAIL_FROM_ADDRESS: id@pacod-id.dev.test
      PID_EMAIL_FROM_NAME: pacod-id (development)
      PID_LOG_FORMAT: text
    volumes:
      - ./pacod-id.toml:/etc/pacod-id/pacod-id.toml:ro
    # As in the Helm chart: nothing is written outside /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      - '127.0.0.1:26070:8070'
      - '127.0.0.1:26071:8071'
      - '127.0.0.1:26072:9170'
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:26026:8025'
    restart: unless-stopped

  # Stands in for Google: the realm's google block names it (pacod-id.toml).
  mock-idp:
    build:
      context: ../..
      dockerfile: deploy/docker/pacod-id.Dockerfile
      target: mock-idp
    image: pacod-id-mock-idp:dev
    environment:
      PID_MOCK_ISSUER: http://127.0.0.1:26080
      PID_MOCK_CLIENTS: dev-google:${PID_DEV_GOOGLE_SECRET}
    ports:
      - '127.0.0.1:26080:7080'
    restart: unless-stopped

volumes:
  pg-data:
