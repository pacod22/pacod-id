# pacod-id on the shared network pacod-net: the app file. It holds pacod-id alone; the shared
# components it uses (pacod-postgres, pacod-db-init, pacod-mailpit) come from
# docker-compose.standalone.yml in the development stack, or from the full stack (pacod-demo),
# which loads this file and provides them once. The naming convention is in
# pacod-demo/docs/NETWORK.md.
#
#   make compose-up      secrets in deploy/compose/.env (made once, random), build, start
#   make compose-down    stop; the database volume stays (docker compose ... down -v drops it)
#
# The development stack listens on 127.0.0.1 only:
#   26070  pacod-id, public: the issuer http://127.0.0.1:26070 (sign-in pages, /oidc, /ui-api)
#   26071  pacod-id, internal: /internal/v1, /admin/v1, server-to-server token calls
#   26072  pacod-id, metrics and probes
#   26026  mailpit's web page: every mail the stack sends ends here, none leaves the machine
#   26080  the mock Google (its issuer, which the browser visits)
#
# pacod-id connects as the role pacod_id, which owns the database pacod_id and is not a
# superuser (platform/postgres/id-db.sh, run by pacod-db-init), as in production.
#
# The secrets (PID_KEK, PID_TOKEN_PEPPER, the bootstrap admin's password and every client's
# secret_env) come from the env file, deploy/compose/.env by default (init-env.sh). The full stack
# replaces that file and PID_CONFIG_FILE with its own.

name: pid-dev

services:
  pacod-id:
    build:
      context: ../..
      dockerfile: deploy/docker/pacod-id.Dockerfile
      target: pacod-id
    image: pacod-id:${PID_VERSION:-dev}
    container_name: pacod-id
    depends_on:
      pacod-db-init:
        condition: service_completed_successfully
        required: false
      pacod-mailpit:
        condition: service_started
        required: false
    env_file:
      - path: .env
        required: false
    environment:
      PID_DATABASE_URL: postgres://pacod_id:${PID_DB_PASSWORD:?run deploy/compose/init-env.sh first}@pacod-postgres:5432/pacod_id
      PID_BOOTSTRAP_ADMIN_EMAIL: ${PID_BOOTSTRAP_ADMIN_EMAIL:-admin@pacod-id.dev.test}
      PID_BOOTSTRAP_ADMIN_REALM: ${PID_BOOTSTRAP_ADMIN_REALM:-shop}
      PID_BOOTSTRAP_ADMIN_ROLES: ${PID_BOOTSTRAP_ADMIN_ROLES:-id.admin}
      # The mail sink; mail never leaves the stack.
      PID_SMTP_HOST: pacod-mailpit
      PID_SMTP_PORT: '1025'
      PID_SMTP_TLS: none
      PID_EMAIL_FROM_ADDRESS: ${PID_EMAIL_FROM_ADDRESS:-id@pacod-id.dev.test}
      PID_EMAIL_FROM_NAME: ${PID_EMAIL_FROM_NAME:-pacod-id (development)}
      PID_LOG_FORMAT: text
    volumes:
      - ${PID_CONFIG_FILE:-./pacod-id.toml}:/etc/pacod-id/pacod-id.toml:ro
    # As in the Helm chart: nothing is written outside /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      - '127.0.0.1:26070:8070'
      - '127.0.0.1:26071:8071'
      - '127.0.0.1:26072:9170'
    networks:
      - pacod-net
    restart: unless-stopped

networks:
  pacod-net:
    external: true
