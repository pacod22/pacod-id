[package]
name = "pacod-id-mock-idp"
description = "A small OpenID provider that stands in for Google in tests and in the development stack."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pacod-id-mock-idp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
pacod-id-jose = { path = "../pacod-id-jose" }
ring = "0.17"
# The mock's own RSA signing key; ring cannot generate one.
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
