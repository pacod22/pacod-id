[package]
name = "pacod-id-jose"
description = "Compact JWS (RS256, ES256) on ring, and JWKS, for pacod-id and the products that check its tokens."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
# Used by products from a vendored copy as a path dependency: states everything itself.

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# RSA test keys only; ring cannot generate them.
rsa = "0.9"
