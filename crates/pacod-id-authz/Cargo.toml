[package]
name = "pacod-id-authz"
description = "The rules engine of pacod-id: product manifests, scopes, bindings and their evaluation."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
# Products use this crate from a vendored copy (such as vendor/pacod-id) as a path dependency,
# so it states everything itself instead of inheriting from the workspace.

[features]
default = ["yaml"]
# Read manifests from YAML. Without it, manifests come in as `ManifestSource` values (JSON).
yaml = ["dep:serde-saphyr"]
# The test-vector runner, for a product's own tests (authz/vectors/*.yaml).
vectors = ["yaml", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Pure Rust and maintained; reading only.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
pacod-id-authz = { path = ".", features = ["vectors"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
