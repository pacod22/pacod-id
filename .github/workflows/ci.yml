name: CI

# Third-party actions are pinned to a commit; the comment names the release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so that new advisories are noticed without a push.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_TOOLCHAIN: '1.99.0'
  NODE_VERSION: '24.21.0'
  UV_VERSION: '0.11.8'

jobs:
  # ---------------------------------------------------------------------------------------
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A server on which the tests may create and drop databases.
      PID_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/pid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------------------
  node:
    name: TypeScript and Svelte (lint, check, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run check
      - run: npm test

  # ---------------------------------------------------------------------------------------
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # ---------------------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Rust dependencies (RustSec advisory database)
        run: cargo audit
      - name: Rust dependencies (licences, bans, sources; deny.toml)
        run: make deny
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Dependencies that reach a product or the image
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------------------
  image:
    name: Image (build, start, probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: make image image-mock
      - name: The chart's configuration passes pacod-id's own check
        run: make chart-check
      - name: The development stack comes up healthy
        run: make compose-up
      - name: Latency of the token endpoint and the feed
        run: make measure
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.standalone.yml --env-file deploy/compose/.env logs

  # ---------------------------------------------------------------------------------------
  chart:
    name: Helm chart (lint, schemas)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make chart-check
