# cargo-deny: licences, banned and duplicate crates, where crates come from, and advisories.
# `make deny` runs it; so does CI. Install with `cargo install cargo-deny --locked`.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
# The RustSec database, as `cargo audit` reads it. An advisory that does not apply is
# ignored here with its id and the reason (.cargo/audit.toml carries the same list).
ignore = [
    # The Marvin attack: timing side channels in the rsa crate's private-key operations
    # (decryption, signing). pacod-id uses rsa only to generate RSA keys, which ring cannot;
    # every signature is made and checked by ring (crates/pacod-id/src/keys.rs).
    { id = "RUSTSEC-2023-0071", reason = "rsa generates keys only; ring signs and verifies" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # TLS and signatures go through rustls and ring; a system-dependent stack must not creep in.
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip = []
skip-tree = []

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
