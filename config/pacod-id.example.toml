# pacod-id: realms and clients. PID_CONFIG names this
# file. Secrets are not written here: a client's secret comes from the variable its
# `secret_env` names (or from `pacod-id clients secret <client>`).

# One realm per issuer host: its own brand, sign-in cookie, languages and policies.
[[realm]]
name = "gateway"
issuer = "https://id.example.com"
brand = "gateway"                     # gateway | cms | kb | shop | bazaar
locales = ["en", "bg", "de", "ru"]
default_locale = "en"
mail_locales = ["bg", "en"]           # every mail carries these languages, in this order
self_signup = false
password_min_length = 12
role_holder_password_min_length = 12  # for accounts holding any role beyond the implicit ones
session_hours = 12
remember_me_days = 7                  # "keep me signed in"
# Holders of these roles create, disable and reset accounts in this realm.
accounts_managed_by = ["gw.platform_admin"]
# Sign-in with Google: the realm's own OAuth client, whose redirect URI is
# <issuer>/federation/google/callback. Without this block, the button does not show.
# google = { client_id = "1234-abc.apps.googleusercontent.com", secret_env = "PID_GOOGLE_SECRET_GATEWAY" }

# The gateway console: a BFF that keeps a secret.
[[client]]
id = "pacod-gw-console"
realm = "gateway"
kind = "confidential"
secret_env = "PGW_UI_CLIENT_SECRET"
redirect_uris = ["https://console.example.com/auth/callback"]
post_logout_redirect_uris = ["https://console.example.com/"]
backchannel_logout_uri = "http://ui:3000/auth/backchannel-logout"
# Where the console starts a sign-in: people go there after accepting an invitation.
initiate_login_uri = "https://console.example.com/auth/login"
audience = "pacod-gw"
access_ttl_seconds = 300

# The gateway's core: pushes its manifest, follows the feed, exchanges tokens for its facades.
[[client]]
id = "pacod-gw-core"
realm = "gateway"
kind = "service"
product = "gw"
secret_env = "PGW_ID_CLIENT_SECRET"
# The audience of the tokens it may exchange: the gateway's own.
audience = "pacod-gw"
